# jev-opt configuration (SPEC.ja.md 8).
#
# Only the values the search driver owns are here. The build recipe --- the
# cargo profile environment, the fixed rustflags, the workload lists, the
# pinned core, the settle gap and the per-case output hashes --- stays in
# scripts/target_common.sh, so that there is exactly one copy of it and a
# change to it is visible to every script at once. `scripts/jev_search.py`
# reads that file through bash rather than duplicating it.
#
# Everything in this file is frozen before round 1 of a run and its sha256 is
# recorded in the run's run-manifest.json. Changing a value invalidates the
# comparison with runs made before the change.

[search]
# Rounds per --proposer jev|random run. The oracle ignores this: its arm
# count is sum(sites x candidates) + 1 combination.
rounds = 5

# Hard ceiling on the number of Choice questions in one round, counting both
# phases. It exists to keep the oracle's build count finite (SPEC.ja.md 2).
# Exceeding it is an error, not a warning.
max_sites = 40

# The `__build__` pseudo-site of SPEC.ja.md 1(2) row 4 / 6: one compiler
# setting for the whole build, chosen once per round. Each entry is passed to
# build_variant exactly as written (a value starting with -C or -Z is a rustc
# flag, anything else is wrapped in -Cllvm-args=). Empty means the
# `__build__` question is not asked at all, which is the frozen default until
# a knob list is chosen from llvm-knobs.json and recorded here.
build_knobs = []

# Split a round's questions into several HTTP requests when the state would
# be larger than this. SPEC.ja.md 6 allows splitting only if it is recorded;
# the split shows up as phase `A.1`, `B.1`, ... in the Jev logs.
max_state_chars = 120000

# SPEC.ja.md 8: function-attribute and loop rounds are separated. The
# two-phase round of decision 61(b) is what the driver implements.
stage = "separate"

[evaluation]
repetitions = 15
warmup = 3
seed = 20260921
resamples = 10000
# Measurement protocol (results.md 170). The values below are protocol v1,
# decision 80, the protocol every frozen comparison used. Protocol v2 is
# selected explicitly (`jev_search.py --protocol v2`, or these keys / the
# matching flags) and changes cost only where noted:
#   confirm_when  "ci": a confirmation batch whenever the first batch's 95%
#                 CI excludes 1 (v1). "mde": only when |ratio - 1| >= MDE
#                 (`mde` below if set, else the batch's own MDE, see
#                 `mde_from`); a sub-MDE difference is reported flat
#                 with one batch --- and so can never be accepted by a
#                 search, since acceptance needs the confirmation.
#   aa_leg        true: every batch carries the in-run A/A copy of the
#                 baseline. false: the oracle's one-factor arm batches are
#                 timed base + cand only; search rounds, the combination
#                 arm, confirmation batches and the holdout keep it.
#   reps_oracle   repetitions of an oracle one-factor arm batch (and its
#                 confirmation). Unset = `repetitions` / `-n`.
#   mde           a frozen MDE for confirm_when = "mde" (floored at
#                 `mde_floor`). Unset = per batch.
#   mde_case      frozen per-case MDEs for the own-case (kernel) readout,
#                 e.g. { k8 = 0.0318 }. Unset = `mde`, else per batch.
# MDE rule v2 final (decision 106): MDE = max(2 x h, mde_floor), where h is
# the aggregate (geomean) A/A half-width (`mde_from = "aggregate"`); a
# per-case claim uses that case's own A/A half-width. Every run before
# decision 106 used mde_from = "worst_case" (2 x the worst per-case
# half-width over the non-base labels) and mde_floor = 0.03 (decision 27);
# set both to reproduce it. Each run records `mde_rule`, `mde_floor` and
# `mde_from` in rounds.jsonl and run-manifest.json.
confirm_when = "ci"
aa_leg = true
# reps_oracle = 8
# mde = 0.01
mde_floor = 0.01
mde_from = "aggregate"

[jev]
# Which route JevClient talks to (decision 111): "gateway" (Vercel AI
# Gateway, every run before this decision), "direct" (TypeSafe's own API,
# api.typesafe.ai --- implemented from documentation only, never exercised
# against the live API in this project: there is no TypeSafe key here), or
# "auto" (the default): pick by which of AI_GATEWAY_API_KEY /
# TYPESAFE_API_KEY is present (both present keeps "gateway"; neither is an
# error naming both variables). Precedence: --jev-endpoint > JEV_ENDPOINT
# (environment or .env) > this key > auto. Leaving this at "auto" is what
# keeps a config that predates decision 111 behaving exactly as before: the
# only key most checkouts have is AI_GATEWAY_API_KEY, so auto picks
# "gateway".
endpoint = "auto"
base_url = "https://ai-gateway.vercel.sh/typesafe"
# Both routes serve the same path (docs.typesafe.ai/api.md).
path = "/v1/systemone"
model = "typesafe-ai/jev"
api_key_env = "AI_GATEWAY_API_KEY"
# direct route only (decision 111); no free tier, $0.042 / 1M input tokens,
# output free (docs.typesafe.ai, 2026-09-25).
direct_base_url = "https://api.typesafe.ai"
direct_key_env = "TYPESAFE_API_KEY"
# The direct API does not accept the gateway's namespaced model id; this is
# the SDK's own default (docs.typesafe.ai/sdk/python/usage).
direct_model = "jev-latest"
# Seconds one HTTP attempt may take. Every landed request of Experiment 5
# took under 1 s and every 503 came back in 120-340 ms (decision 92 d).
request_timeout_s = 20
# Hard cap on HTTP attempts per request. 503s are fast provider-side
# rejections whose rate tracks body size, so attempts, not waiting, are
# what lands a large request (decision 92 d).
retries = 200
# Wall-clock budget per request: no further attempt is made once the next
# pause would take the request past it.
retry_wall_budget_s = 600
# Upper bound on the pause between attempts (fixed 2 s +-20% jitter); a
# 429's or 529's Retry-After is honoured even when it asks for longer
# (decision 111: 529 "overloaded" is retried exactly like any other 5xx).
backoff_cap_s = 5.0
# Unchanged re-sends of an exhausted request within the same round before
# the phase is recorded as lost and the round is not built.
phase_resend_max = 2
# Below this confidence a Choice answer is replaced by KEEP_DEFAULT and the
# reason is recorded (SPEC.ja.md 6). 0 disables the rule: the spec asks for a
# threshold but fixes no value, and the one sample response in
# docs/jev-samples answered decisively at confidence 0.47, so any non-zero
# default would have been invented rather than measured.
min_confidence = 0.0
api_cost_budget_usd = 5.0
